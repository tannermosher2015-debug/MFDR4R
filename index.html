<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --font-ui:'Archivo',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#e9edf2; --surface:#ffffff; --surface-2:#f4f7fb; --surface-3:#eef2f7;
  --border:#d4dce6; --border-strong:#b9c5d3;
  --text:#15202d; --muted:#566372; --faint:#606b78;
  --accent:#1d4ed8; --accent-text:#ffffff; --accent-weak:#e6edfb;
  --ok:#117a3d; --ok-bg:#e3f4e9; --warn:#8a5a00; --warn-bg:#fbf0d9; --crit:#b42318; --crit-bg:#fbe7e4;
  --p1:#c4361f; --p2:#1f4fc4; --p3:#1f7a3d; /* 1st red, 2nd blue, 3rd green */
  --shadow:0 1px 2px rgba(16,32,50,.06),0 4px 16px rgba(16,32,50,.07);
  --shadow-lg:0 8px 40px rgba(16,32,50,.18);
  --radius:12px; --radius-sm:8px;
}
[data-theme="dark"]{
  --bg:#0c121b; --surface:#152030; --surface-2:#1a273a; --surface-3:#20304a;
  --border:#2a3b54; --border-strong:#3a5172;
  --text:#e9eff6; --muted:#9fb1c6; --faint:#7d8fa0;
  --accent:#5b8cff; --accent-text:#0b1320; --accent-weak:#16233c;
  --ok:#3fce80; --ok-bg:#15311f; --warn:#f0b13e; --warn-bg:#332611; --crit:#ff7a6b; --crit-bg:#39181a;
  /* platoon colors keep the (darker) light values in dark mode so white badge text stays AA */
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
  --shadow-lg:0 10px 50px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em;line-height:1.2}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit;cursor:pointer}
.mono{font-family:var(--font-mono)}
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--accent-text);padding:10px 16px;border-radius:0 0 8px 0;z-index:200}
.skip:focus{left:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* layout */
.app{max-width:1240px;margin:0 auto;padding:0 20px 64px}
header.top{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto}
.brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(150deg,var(--accent),#0b3bbf);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:none}
.brand .t{font-weight:800;font-size:15px;letter-spacing:-.02em;line-height:1.05}
.brand .s{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.ctl{display:flex;align-items:center;gap:8px}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700}
select,input[type=text],input[type=email],input[type=date]{font-family:inherit;font-size:14px;background:var(--surface-2);color:var(--text);border:1px solid var(--border-strong);border-radius:8px;padding:7px 10px}
.iconbtn{width:38px;height:38px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);display:grid;place-items:center;position:relative;font-size:16px}
.iconbtn:hover{background:var(--surface-3)}
.badge-count{position:absolute;top:-6px;right:-6px;background:#bf2a1e;color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.btn{border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);padding:8px 14px;border-radius:9px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.btn.crit{background:var(--crit);color:#fff;border-color:transparent}

nav.tabs{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);padding:13px 14px;font-weight:600;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--text)}

main{padding-top:24px}
.page-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.page-head h2{font-size:23px}
.page-head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.spacer{flex:1}

.grid{display:grid;gap:16px}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-2{grid-template-columns:repeat(2,1fr)}
.cols-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:860px){.cols-3,.cols-4{grid-template-columns:1fr 1fr}.cols-2{grid-template-columns:1fr}}
@media(max-width:560px){.cols-3,.cols-4,.cols-2{grid-template-columns:1fr}.top-in{gap:10px}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card .hd{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.card .hd h3{font-size:15px}
.card .bd{padding:18px}
.card .bd.tight{padding:0}

.stat{padding:16px 18px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700}
.stat .v{font-family:var(--font-mono);font-size:30px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.stat .sub{font-size:12.5px;color:var(--muted);margin-top:2px}

.bar{height:10px;background:var(--surface-3);border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar.ok > i{background:var(--ok)} .bar.warn > i{background:var(--warn)} .bar.crit > i{background:var(--crit)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700;background:var(--surface-2);position:sticky;top:0}
tbody tr:hover{background:var(--surface-2)}
.scroll{max-height:520px;overflow:auto;border-radius:0 0 var(--radius) var(--radius)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.accent{background:var(--accent-weak);color:var(--accent)} .pill.muted{background:var(--surface-3);color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.p-R{background:var(--p1)} .p-G{background:var(--p3)} .p-B{background:var(--p2)}
.ptag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;color:#fff}
.ptag.R{background:var(--p1)} .ptag.B{background:var(--p2)} .ptag.G{background:var(--p3)}

/* segmented control (recall-order toggle) */
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:9px;overflow:hidden;background:var(--surface-2);flex:none}
.seg button{border:none;background:transparent;color:var(--muted);padding:8px 13px;font-weight:600;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button + button{border-left:1px solid var(--border-strong)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-text)}
.seg button.warnactive[aria-pressed=true]{background:var(--crit);color:#fff}
.tierbadge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;border:1px solid var(--border-strong);color:var(--muted)}
.tierbadge.t1{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.tierbadge.t2{background:var(--accent-weak);color:var(--accent);border-color:transparent}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;text-align:center;padding:4px 0}
.cell{min-height:78px;min-width:0;border:1px solid var(--border);border-radius:10px;padding:6px 7px;background:var(--surface-2);position:relative;display:flex;flex-direction:column;gap:4px}
.cell .ev{overflow-wrap:anywhere}
.cell.empty{background:transparent;border:none}
.cell .dn{font-family:var(--font-mono);font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.cell .od{font-size:10px;font-weight:700;color:#fff;border-radius:5px;padding:1px 6px}
.cell.today{outline:2px solid var(--accent);outline-offset:1px}
.cell .ev{font-size:11px;font-weight:600;border-radius:6px;padding:2px 6px;line-height:1.3;cursor:pointer;border:1px solid transparent}
.ev.open{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.ev.elig{background:var(--accent-weak);color:var(--accent);border-color:var(--accent)}
.ev.bidpend{background:var(--surface-3);color:var(--muted)}
.ev.sel{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.ev.avail{background:var(--ok-bg);color:var(--ok);border:1px dashed var(--ok)}
.ev.locked{background:transparent;color:var(--faint);border:1px dashed var(--border-strong);cursor:not-allowed}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;border:1px solid var(--border-strong)}

/* candidate rows (fill flow) */
.cand{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.cand + .cand{margin-top:8px}
.cand.top{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}
.cand .rank{font-family:var(--font-mono);font-size:18px;font-weight:600;width:26px;color:var(--faint)}
.cand .who{min-width:120px}
.cand .who b{font-family:var(--font-mono)}
.cand .why{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.cand .hrs{text-align:right;min-width:120px}
.cand .hrs .big{font-family:var(--font-mono);font-weight:600;font-size:15px}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface-3);color:var(--muted);display:inline-flex;gap:4px;align-items:center}
.chip.good{background:var(--ok-bg);color:var(--ok)}
.chip.flag{background:var(--warn-bg);color:var(--warn)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(8,16,28,.55);display:grid;place-items:center;padding:20px;z-index:100}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);max-width:760px;width:100%;max-height:88vh;overflow:auto}
.modal .mh{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--surface)}
.modal .mh h3{font-size:18px}
.modal .mb{padding:22px}
.modal .mf{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface)}

/* toast */
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:300;max-width:380px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;box-shadow:var(--shadow-lg);padding:12px 14px;font-size:13.5px;animation:slidein .25s ease}
.toast.ok{border-left-color:var(--ok)} .toast.warn{border-left-color:var(--warn)}
.toast b{display:block;margin-bottom:2px}
@keyframes slidein{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* guided tour */
.tour-block{position:fixed;inset:0;z-index:479}/* transparent click-guard so the tour drives itself */
.tour-backdrop{position:fixed;inset:0;background:rgba(8,16,28,.62);z-index:480}
.tour-spot{position:fixed;border-radius:11px;box-shadow:0 0 0 9999px rgba(8,16,28,.62),0 0 0 3px var(--accent);z-index:481;transition:all .25s ease;pointer-events:none}
.tour-card{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:500;width:min(580px,calc(100% - 28px));background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);padding:18px 22px;animation:slidein .25s ease}
.tour-card .tour-step{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.tour-card h3{font-size:18px;margin:4px 0 8px}
.tour-card p{margin:0;font-size:14px;line-height:1.55;color:var(--text)}
.tour-card .tour-nav{display:flex;align-items:center;gap:8px;margin-top:16px}
.tour-dots{display:flex;gap:5px}
.tour-dots i{width:7px;height:7px;border-radius:50%;background:var(--border-strong);display:block}
.tour-dots i.on{background:var(--accent)}
@media(max-width:600px){.tour-card{bottom:12px;padding:15px 16px}.tour-card h3{font-size:16px}}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.note{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--muted)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--border);border-radius:12px;overflow:hidden}
@media(max-width:600px){.split{grid-template-columns:1fr}}
.split > div{padding:18px}
.split .before{background:var(--crit-bg)} .split .after{background:var(--ok-bg)}
.split h4{font-size:13px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.split .before h4{color:var(--crit)} .split .after h4{color:var(--ok)}
.split ul{margin:0;padding-left:18px;font-size:13.5px}.split li{margin:5px 0}
.distrib{display:flex;align-items:flex-end;gap:3px;height:130px;padding-top:8px}
.distrib .b{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:3px;opacity:.85;transition:height .3s cubic-bezier(.4,0,.2,1)}
@keyframes viewenter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
main.enter{animation:viewenter .28s cubic-bezier(.22,.61,.36,1)}
.footer{margin-top:40px;color:var(--faint);font-size:12px;text-align:center;border-top:1px solid var(--border);padding-top:18px}
.hl{background:linear-gradient(transparent 60%,var(--accent-weak) 0)}
.intro{display:flex;gap:13px;align-items:flex-start;background:var(--accent-weak);border:1px solid var(--accent);border-radius:12px;padding:13px 15px;margin-bottom:18px}
.intro .ico{flex:none;width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;font-weight:800;font-style:italic;font-family:var(--font-mono)}
.intro .tx{font-size:13px;line-height:1.5;color:var(--text)}
.intro .x{flex:none;margin-left:6px;background:none;border:none;color:var(--muted);font-size:14px;line-height:1;padding:4px 7px;border-radius:7px;align-self:flex-start}
.intro .x:hover{background:var(--surface);color:var(--text)}

/* ---------- mobile optimization (≤640px) ---------- */
@media(max-width:640px){
  .app{padding:0 12px 56px}
  main{padding-top:18px}
  .page-head{margin-bottom:14px}
  .page-head h2{font-size:20px}
  .brand .s{display:none}
  .brand .mark{width:30px;height:30px;font-size:13px}
  .brand .t{font-size:14px}
  .top-in{gap:8px 10px;padding:10px 12px}
  .ctl{gap:6px;flex-wrap:wrap;width:100%}
  .ctl .field:first-of-type{flex:1 1 100%}
  #roleSel{width:100%}
  #dateLbl{font-size:12px}
  /* any table that's still wide scrolls inside its card — never the whole page */
  .card .bd.tight{overflow-x:auto;-webkit-overflow-scrolling:touch}
  /* responsive tables reflow into stacked cards */
  table.resp thead{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
  table.resp tbody,table.resp tr,table.resp td{display:block;width:100%}
  table.resp tr{border:1px solid var(--border);border-radius:12px;margin:0 0 10px;background:var(--surface);overflow:hidden}
  table.resp tr:hover{background:var(--surface)}
  table.resp td{display:flex;justify-content:space-between;align-items:center;gap:16px;text-align:right;border:none;border-bottom:1px solid var(--border);padding:9px 14px;min-height:42px}
  table.resp td:last-child{border-bottom:none}
  table.resp td::before{content:attr(data-label);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);font-weight:700;text-align:left;flex:0 0 auto}
  table.resp td.act{padding:10px 12px}
  table.resp td.act::before{display:none}
  table.resp td.act .btn{width:100%;justify-content:center;min-height:44px}
  table.resp td .bar{flex:1;min-width:64px}
  .scroll{max-height:72vh}
  /* fill-modal candidate rows stack cleanly */
  .cand{flex-wrap:wrap;gap:8px 10px}
  .cand .who{min-width:0;flex:1}
  .cand .hrs{min-width:0;text-align:right}
  .cand .why{flex-basis:100%;order:10}
  .cand > .btn{flex-basis:100%;order:11;width:100%;justify-content:center;min-height:44px}
  .modal .mb{padding:16px}
  .modal .mh,.modal .mf{padding-left:16px;padding-right:16px}
  .legend{gap:10px}
  /* dense month calendar fits 7 columns on a phone */
  .cal{gap:4px}
  .cell{min-height:60px;padding:5px 4px;gap:3px}
  .cell .dn{font-size:12px}
  .cell .od{font-size:9px;padding:1px 4px}
  .cell .ev{font-size:9px;padding:2px 4px;line-height:1.15}
}
@media print{
  :root,[data-theme="dark"]{--bg:#fff;--surface:#fff;--surface-2:#fff;--surface-3:#f1f3f6;--text:#111;--muted:#444;--faint:#555;--border:#bbb;--border-strong:#999;--accent:#0b3bbf;--accent-text:#fff;--accent-weak:#eef1fb;--ok:#0a6b34;--ok-bg:#eaf5ee;--warn:#7a4f00;--warn-bg:#f7efdd;--crit:#a11;--crit-bg:#fbeae8;--shadow:none;--shadow-lg:none}
  header.top, nav.tabs, .footer, #toasts, .intro, .skip, .scrim, input, select, button, td.act, th:last-child{display:none!important}
  body{background:#fff}
  .app{max-width:100%;padding:0}
  main{padding-top:0}
  .card{box-shadow:none;border:1px solid var(--border);margin-bottom:10px}
  .scroll{max-height:none!important;overflow:visible!important}
  .split,.cand,.stat,.card{break-inside:avoid}
  a{color:#000;text-decoration:none}

<script>
"use strict";
/* ============================================================ 1. CONFIG & SCHEDULE */
const FY_CAP=288, MIN_BLOCK=12, STRAIGHT_CAP=34;
const CLASSES=['Engine','Mini','Tanker','Ladder','Hazmat','Rescue'];
const REASONS={SL:'Sick Leave',VAC:'Vacation',FL:'Funeral Leave',SA:'Special Assignment',SUBO:'Substitution (requesting)',RELO:'Relocation drive',IL:'Industrial Leave'};
const reasonLbl=c=>REASONS[c]?`${REASONS[c]} [${c}]`:c;
const KELLY=['R','G','B','G','B','R','B','R','G'];            // 9-day cycle, one platoon on-duty per day
const PLATOON={R:{name:'1st Platoon',color:'var(--p1)'},B:{name:'2nd Platoon',color:'var(--p2)'},G:{name:'3rd Platoon',color:'var(--p3)'}};
const ANCHOR='2026-06-01';                                    // ANCHOR + KELLY[0]=R  → matches the official June 2026 calendar
const DEMO_DATE='2026-06-19';                                 // "today" in the demo (circled red / 1st platoon on official cal)

const MS=86400000;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12,0,0);};
const fmt=s=>pd(s).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const fmtShort=s=>pd(s).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
const cycleIdx=s=>{const diff=Math.round((pd(s)-pd(ANCHOR))/MS);return((diff%9)+9)%9;};
const onDutyPlatoon=s=>KELLY[cycleIdx(s)];
const isOnDuty=(m,s)=>onDutyPlatoon(s)===m.platoon;
const onDutyAtIdx=(plat,idx)=>KELLY[((idx%9)+9)%9]===plat;
// 4-day-off cycle indices per platoon (the primary recall window)
const FOURDAY={};
for(const p of Object.keys(PLATOON)){
  const set=new Set(); let run=[];
  for(let i=0;i<18;i++){ if(!onDutyAtIdx(p,i)){run.push(i);} else {if(run.length>=4)run.forEach(x=>set.add(((x%9)+9)%9)); run=[];} }
  if(run.length>=4)run.forEach(x=>set.add(((x%9)+9)%9));
  FOURDAY[p]=set;
}
const inFourDayOff=(m,s)=>FOURDAY[m.platoon].has(cycleIdx(s));
const adjacentOnDuty=(m,s)=>{const i=cycleIdx(s);return onDutyAtIdx(m.platoon,i-1)||onDutyAtIdx(m.platoon,i+1);};

/* ============================================================ 2. SEED DATA */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const STATIONS=[
 {id:'s1',name:'Wailuku',island:'Maui',remote:false,bn:'Bn 2',companies:[{c:'Engine',min:5},{c:'Mini',min:2}]},
 {id:'s2',name:'Pāʻia',island:'Maui',remote:false,bn:'Bn 1',companies:[{c:'Engine',min:5}]},
 {id:'s3',name:'Lahaina',island:'Maui',remote:false,bn:'Bn 2',companies:[{c:'Engine',min:5},{c:'Ladder',min:5},{c:'Tanker',min:1}]},
 {id:'s4',name:'Kaunakakai',island:'Molokaʻi',remote:true,bn:'Bn 2',companies:[{c:'Engine',min:5},{c:'Tanker',min:1}]},
 {id:'s5',name:'Makawao',island:'Maui',remote:false,bn:'Bn 1',companies:[{c:'Engine',min:5}]},
 {id:'s6',name:'Kīhei',island:'Maui',remote:false,bn:'Bn 1',companies:[{c:'Engine',min:5}]},
 {id:'s7',name:'Hāna',island:'Maui',remote:true,bn:'Bn 1',companies:[{c:'Engine',min:3},{c:'Tanker',min:1}]},
 {id:'s8',name:'Lānaʻi',island:'Lānaʻi',remote:true,bn:'Bn 2',companies:[{c:'Engine',min:3},{c:'Tanker',min:1}]},
 {id:'s9',name:'Hoʻolehua',island:'Molokaʻi',remote:true,bn:'Bn 2',companies:[{c:'Engine',min:3}]},
 {id:'s10',name:'Kahului',island:'Maui',remote:false,bn:'Bn 1',companies:[{c:'Engine',min:5},{c:'Tanker',min:1},{c:'Hazmat',min:5},{c:'Rescue',min:5}]},
 {id:'s11',name:'Nāpili',island:'Maui',remote:false,bn:'Bn 2',companies:[{c:'Engine',min:5}]},
 {id:'s12',name:'Pukoʻo',island:'Molokaʻi',remote:true,bn:'Bn 2',companies:[{c:'Engine',min:3}]},
 {id:'s13',name:'Kula',island:'Maui',remote:false,bn:'Bn 1',companies:[{c:'Engine',min:5},{c:'Tanker',min:1}]},
 {id:'s14',name:'Wailea',island:'Maui',remote:false,bn:'Bn 1',companies:[{c:'Engine',min:5},{c:'Ladder',min:5},{c:'Tanker',min:1}]},
];
const stById=id=>STATIONS.find(s=>s.id===id);
const STEPS=['E','F','G','H','L1','L2','L3','L4','L5','L6'];
const GRADES=['SR15','SR17','SR19','SR21','SR25'];
const RANK_OF_GRADE={'SR15':'Recruit','SR17':'FF I','SR19':'FF II','SR21':'FF III','SR25':'Captain'};
const GRADE_OF_RANK={'Recruit':'SR15','FF I':'SR17','FF II':'SR19','FF III':'SR21','Captain':'SR25'};
const RANKLIST=['Recruit','FF I','FF II','FF III','Captain'];
// BU 11 salary schedule, Exhibit E eff. 7/1/24 — base 56-hour-week hourly rate by grade/step
const SALARY={
 'SR15':{E:21.93},
 'SR17':{E:23.72,F:24.66,G:25.64,H:26.67,L1:27.73,L2:28.84,L3:30.00,L4:31.20,L5:32.45,L6:33.77},
 'SR19':{E:25.64,F:26.67,G:27.73,H:28.84,L1:30.00,L2:31.20,L3:32.45,L4:33.77,L5:35.10,L6:36.51},
 'SR21':{E:27.73,F:28.84,G:30.00,H:31.20,L1:32.45,L2:33.77,L3:35.10,L4:36.51,L5:37.96,L6:39.48},
 'SR25':{E:32.45,F:33.77,G:35.10,H:36.51,L1:37.96,L2:39.48,L3:41.05,L4:42.70,L5:44.42,L6:46.20}
};
// July 2024 Jurisdiction-M Unit 11 scattergram — FTE by grade × step (286 total)
const SCATTER={
 'SR15':{E:1},
 'SR17':{E:40,F:35,G:35,H:8,L1:5,L2:3,L3:1,L4:3,L5:1},
 'SR19':{G:3,H:5,L1:4,L2:1},
 'SR21':{G:4,H:11,L1:24,L2:12,L3:9,L4:20,L5:2},
 'SR25':{L2:7,L3:13,L4:23,L5:8,L6:8}
};
const OT_MULT=1.5;                                            // recall paid at 1.5× base (FLSA)
function baseHourly(m){const g=SALARY[m.grade]||{};return g[m.step]!=null?g[m.step]:(g.E||0);}
function otRate(m){return baseHourly(m)*OT_MULT;}
function annualPay(m){return Math.round(baseHourly(m)*2912);}  // 56 hrs × 52.07 wks ≈ 2912 hrs/yr
function sampleHours(rng){const r=rng();let h;if(r<.16)h=rng()*64;else if(r<.78)h=84+rng()*132;else h=216+rng()*72;return Math.min(FY_CAP,Math.round(h/12)*12);}

function buildMembers(){
  const rng=mulberry32(20260619); const members={}; let id=1001;
  const pool=[]; STATIONS.forEach(s=>{const w=s.companies.length+1;for(let i=0;i<w;i++)pool.push(s.id);});
  let p=0;
  // generate the real Jurisdiction-M scattergram exactly: one anonymized FTE per (grade, step) count
  GRADES.forEach(grade=>{ const rank=RANK_OF_GRADE[grade];
    STEPS.forEach(step=>{ const n=(SCATTER[grade]||{})[step]||0; for(let i=0;i<n;i++){
      const stationId=pool[Math.floor(rng()*pool.length)]; const st=stById(stationId);
      const platoon=['R','G','B'][p++%3];
      const qual=new Set(['Engine']);
      st.companies.forEach(c=>{if(c.c!=='Engine'&&rng()<.55)qual.add(c.c);});
      if(rng()<.2)qual.add(CLASSES[Math.floor(rng()*CLASSES.length)]);
      const ql=[...qual];
      members['FF-'+id]={id:'FF-'+id,rank,grade,step,homeStationId:stationId,platoon,
        qualifiedClasses:ql, fyHours:sampleHours(rng), holdBackHours:rng()<.28?Math.round(rng()*6)*12:0,
        dayOfPrefs:ql.filter(()=>rng()<.7), suspendedUntil: rng()<.04?'2026-07-15':null};
      id++;
    }});
  });
  // hero scenario: tune a few SR17 (FF I) members' station/platoon/hours for the Kīhei sick-call story
  // (grade & step untouched, so the real scattergram totals stay exact)
  const heroT={
    'FF-1042':{homeStationId:'s11',platoon:'B',fyHours:24,holdBackHours:48,qualifiedClasses:['Engine']},          // Nāpili – lowest hrs
    'FF-1015':{homeStationId:'s4',platoon:'B',fyHours:36,holdBackHours:24,qualifiedClasses:['Engine']},            // Kaunakakai/Molokaʻi – off-island reach
    'FF-1090':{homeStationId:'s14',platoon:'B',fyHours:60,holdBackHours:12,qualifiedClasses:['Engine','Tanker']},  // Wailea
    'FF-1067':{homeStationId:'s10',platoon:'B',fyHours:96,holdBackHours:0,qualifiedClasses:['Engine','Ladder','Hazmat']}, // Kahului
    'FF-1108':{homeStationId:'s6',platoon:'B',fyHours:168,holdBackHours:0,qualifiedClasses:['Engine']},            // Kīhei – SAME station, near cap → ranked low
  };
  Object.keys(heroT).forEach(hid=>{ if(members[hid]) Object.assign(members[hid],heroT[hid]); });
  return members;
}

function buildSeed(){
  const members=buildMembers();
  // hero vacancy: Kīhei Engine, sick call for the June 19 (1st platoon) shift — station can't backfill
  const vacancies=[
    {id:'v-hero',stationId:'s6',cls:'Engine',rank:'FF I',date:DEMO_DATE,segment:'full24',hours:24,type:'unscheduled',
     status:'open',reason:'SL',shortBy:1,wouldHoldBack:true,assigneeId:null,bids:[]},
    // another open same-day need for the command center
    {id:'v2',stationId:'s5',cls:'Engine',rank:'FF III',date:DEMO_DATE,segment:'full24',hours:24,type:'unscheduled',status:'open',reason:'SA',shortBy:1,wouldHoldBack:false,assigneeId:null,bids:[]},
    {id:'v7',stationId:'s8',cls:'Engine',rank:'FF III',date:DEMO_DATE,segment:'full24',hours:24,type:'unscheduled',status:'open',reason:'SL',shortBy:1,wouldHoldBack:true,assigneeId:null,bids:[]},
    // scheduled (advance / bid) openings — late June
    {id:'v3',stationId:'s10',cls:'Engine',rank:'FF I',date:'2026-06-18',segment:'full24',hours:24,type:'scheduled',status:'open',reason:'VAC',shortBy:1,assigneeId:null,bids:['FF-1067']},
    {id:'v4',stationId:'s3',cls:'Ladder',rank:'Captain',date:'2026-06-18',segment:'0730-1930',hours:12,type:'scheduled',status:'open',reason:'SA',shortBy:1,assigneeId:null,bids:[]},
    {id:'v5',stationId:'s11',cls:'Engine',rank:'FF III',date:'2026-06-23',segment:'full24',hours:24,type:'scheduled',status:'open',reason:'VAC',shortBy:1,assigneeId:null,bids:[]},
    {id:'v6',stationId:'s13',cls:'Tanker',rank:'FF III',date:'2026-06-20',segment:'full24',hours:24,type:'scheduled',status:'open',reason:'FL',shortBy:1,assigneeId:null,bids:[]},
  ];
  return {members,vacancies:[...vacancies,...genForecast()]};
}
// Deterministic look-ahead: scatters 1-2 scheduled coverage gaps per day across ~5 weeks
// (real stations/ranks/apparatus, scheduled reasons only, Engine-heavy so counterparts exist).
// Same seed every load/reset, so the demo calendar is stable. Hero + v2-v7 stay untouched.
function genForecast(){
  const rng=mulberry32(424242); const out=[];
  const schedReasons=['VAC','FL','SA','RELO'];
  const rankPool=['FF I','FF I','FF II','FF III','FF III','Captain'];   // weighted to common ranks
  const start=addDays(DEMO_DATE,2);                                     // begin after the June 19 hero window
  for(let i=0;i<36;i++){
    const date=addDays(start,i);
    const n=rng()<.30?0:(rng()<.66?1:2);
    for(let k=0;k<n;k++){
      const st=STATIONS[Math.floor(rng()*STATIONS.length)];
      const cls=rng()<.72?'Engine':st.companies[Math.floor(rng()*st.companies.length)].c; // Engine-heavy → always fillable
      const twelve=rng()<.16;
      out.push({id:`f-${date}-${k}`,stationId:st.id,cls,rank:rankPool[Math.floor(rng()*rankPool.length)],
        date,segment:twelve?'0730-1930':'full24',hours:twelve?12:24,type:'scheduled',status:'open',
        reason:schedReasons[Math.floor(rng()*schedReasons.length)],shortBy:1,
        wouldHoldBack:rng()<.18,assigneeId:null,bids:[]});
    }
  }
  return out;
}

/* ============================================================ 3. STATE STORE */
const LS='mfd-ot-recall-v7';
let state;
function seedLog(){return [
  {t:'07:42',type:'assign',by:'BC 1',memberId:'FF-1067',station:'Kahului',rank:'FF I',cls:'Engine',note:'Accepted advance bid (VAC) — recommended #1'},
  {t:'07:33',type:'accept',by:'BC 1',memberId:'FF-1067',station:'Kahului',rank:'FF I',cls:'Engine',note:'Accepted recall'},
  {t:'07:31',type:'decline',by:'BC 2',memberId:'FF-1108',station:'Wailea',rank:'FF I',cls:'Engine',note:'Declined — already committed'},
  {t:'07:25',type:'offer',by:'BC 2',memberId:'FF-1108',station:'Wailea',rank:'FF I',cls:'Engine',note:'Lowest-hours eligible (county-wide)'},
];}
function freshState(){const seed=buildSeed();return{role:'bc1',theme:'light',mode:'equity',demoDate:DEMO_DATE,view:null,
  members:seed.members,vacancies:seed.vacancies,availability:{},notifications:[],introDismissed:false,
  forecastRange:'week',forecastAnchor:DEMO_DATE,otRate:55,log:seedLog(),modal:null,tour:null};}
function load(){try{const r=localStorage.getItem(LS);if(r){state=JSON.parse(r);state.modal=null;state.tour=null;if(!state.mode)state.mode='equity';if(!state.forecastRange)state.forecastRange='week';if(!state.forecastAnchor)state.forecastAnchor=DEMO_DATE;return;}}catch(e){}state=freshState();}
function save(){try{const{modal,tour,...rest}=state;localStorage.setItem(LS,JSON.stringify(rest));}catch(e){}}
function resetDemo(){state=freshState();save();render();toast('ok','Demo reset','Back to the June 19 sick-call scenario.');}

/* ============================================================ 4. EQUITY ENGINE */
function remaining(m){return FY_CAP-m.fyHours;}
function coMin(v){const c=stById(v.stationId).companies.find(x=>x.c===v.cls);return c?c.min:0;}
function ratioStr(v){const m=coMin(v);return `${m-(v.shortBy||0)}/${m}`;}
function checks(m,vac){
  const sameRank=m.rank===vac.rank;                            // rank-for-rank
  const sameClass=m.qualifiedClasses.includes(vac.cls);        // similar function
  const off=!isOnDuty(m,vac.date);
  const window=inFourDayOff(m,vac.date);
  const straight=!adjacentOnDuty(m,vac.date);
  const cap=remaining(m)>0; // remaining-balance rule: any balance (even below the 12-hr min block) may finish out the FY guarantee
  const notSusp=!(m.suspendedUntil && m.suspendedUntil>=vac.date);
  const notBusy=!state.vacancies.some(v=>v.id!==vac.id&&v.assigneeId===m.id&&v.date===vac.date);
  return {sameRank,sameClass,off,window,straight,cap,notSusp,notBusy};
}
function eligible(m,vac){const c=checks(m,vac);return c.sameRank&&c.sameClass&&c.off&&c.window&&c.straight&&c.cap&&c.notSusp&&c.notBusy;}
function tier(m,vac){const st=stById(vac.stationId),ms=stById(m.homeStationId);
  if(m.homeStationId===vac.stationId)return 1;                 // same station
  if(ms.island===st.island)return 2;                           // same island
  return 3;}                                                   // county-wide (off-island)
const TIERLBL={1:'Same station',2:'Same island',3:'County-wide'};
function eqSort(vac){return (a,b)=> a.fyHours-b.fyHours || tier(a,vac)-tier(b,vac) || b.holdBackHours-a.holdBackHours || a.id.localeCompare(b.id);}
function rankCandidates(vac){
  const declined=new Set(vac.declined||[]);
  const list=Object.values(state.members).filter(m=>eligible(m,vac)&&!declined.has(m.id));
  if(state.mode==='firstcome')
    list.sort((a,b)=> eagerness(b)-eagerness(a) || b.fyHours-a.fyHours || a.id.localeCompare(b.id)); // §VI first-come: quickest / most frequent takers respond first
  else
    list.sort(eqSort(vac));                                                                          // equity-first: fewest recall hours wins
  return list;
}
// who the equity engine would offer first, regardless of the active mode (used to show the cost of first-come)
function equityBest(vac){const d=new Set(vac.declined||[]);
  return Object.values(state.members).filter(m=>eligible(m,vac)&&!d.has(m.id)).sort(eqSort(vac))[0]||null;}
// Deterministic "phone-tree" eagerness: under first-come, a motivated minority who answer
// first / want the hours scoop most of the OT. Stable per member id so the projection repeats.
function eagerness(m){let h=0;for(const ch of m.id)h=(h*31+ch.charCodeAt(0))>>>0;const r=(h%1000)/1000;
  return r<0.22?6:(r<0.5?1.6:0.4);}

/* ============================================================ 5. RENDER */
const $=s=>document.querySelector(s); const root=$('#main'); let _lastView=null;
const NAV={bc:[['cmd','Command Center'],['forecast','Shortage Forecast'],['cost','Cost & Coverage'],['equity','Equity Dashboard'],['audit','Audit Log'],['roster','Roster'],['create','Create Opportunity'],['reports','Reports']],
  ff:[['home','Homepage'],['forecast','Shortage Forecast'],['opps','Bid for Assignment'],['avail','Day-Of Availability'],['nobid','No-Bid'],['profile','User Profile']]};
function curMember(){return isBC()?null:state.members[state.role];}
function isBC(){return state.role==='bc1'||state.role==='bc2';}
function curBn(){return state.role==='bc2'?'Bn 2':'Bn 1';}
function bcNum(){return state.role==='bc2'?'2':'1';}

function render(){
  if(window.__projTimer){clearInterval(window.__projTimer);window.__projTimer=null;} // stop any in-flight projection before the DOM is rebuilt
  document.documentElement.setAttribute('data-theme',state.theme);
  $('#dateLbl').textContent=fmt(state.demoDate);
  // role select
  const sel=$('#roleSel');
  const feat=['FF-1042','FF-1200','FF-1250'];
  sel.innerHTML=`<option value="bc1">Battalion Chief 1</option><option value="bc2">Battalion Chief 2</option>`+
    feat.map(id=>{const m=state.members[id];return m?`<option value="${id}">${id} · ${m.grade} ${m.rank} · ${stById(m.homeStationId).name}</option>`:'';}).join('');
  sel.value=state.role;
  // tabs
  const items=isBC()?NAV.bc:NAV.ff;
  if(state.view!=='how' && !items.find(i=>i[0]===state.view))state.view=items[0][0];
  const anySel=items.some(i=>i[0]===state.view);
  $('#tabs').innerHTML=items.map(([k,l],idx)=>`<button role="tab" id="tab-${k}" data-act="nav" data-v="${k}" aria-controls="main" aria-selected="${k===state.view?'true':'false'}" tabindex="${(k===state.view||(!anySel&&idx===0))?'0':'-1'}">${l}</button>`).join('');
  const at=items.find(i=>i[0]===state.view); if(at){$('#main').setAttribute('aria-labelledby','tab-'+at[0]);}else{$('#main').removeAttribute('aria-labelledby');}
  // bell
  const n=state.notifications.length;const bc=$('#bellCount');bc.hidden=!n;bc.textContent=n;
  // view
  const V={cmd:viewCmd,forecast:viewForecast,cost:viewCost,create:viewCreate,equity:viewEquity,audit:viewAudit,roster:viewRoster,reports:viewReports,how:viewHow,
           home:viewHome,opps:viewOpps,avail:viewAvail,nobid:viewNoBid,profile:viewProfile};
  root.innerHTML=(V[state.view]||(()=>'<p>Not found</p>'))();
  if(state.view!==_lastView){_lastView=state.view;root.classList.remove('enter');void root.offsetWidth;root.classList.add('enter');} // one-shot entrance only when the view actually changes
  if(state.modal)renderModal();else $('#modalRoot').innerHTML='';
  renderTour();
  save();
}

function hoursBar(used,cap=FY_CAP){const pct=Math.min(100,Math.round(used/cap*100));const cls=pct>=90?'crit':pct>=70?'warn':'ok';
  return `<div class="bar ${cls}"><i style="width:${pct}%"></i></div>`;}
function vacChip(v){const st=stById(v.stationId);return `${st.name} · ${v.cls}`;}

/* ---------- BC: Command Center ---------- */

function statCard(k,v,sub,tone){return `<div class="card stat"><div class="k">${k}</div><div class="v" ${tone?`style="color:var(--${tone})"`:''}>${v}</div><div class="sub">${sub}</div></div>`;}
function introCallout(){return `<div class="intro" role="note">
  <div class="ico" aria-hidden="true">i</div>
  <div class="tx">Each row below is a vacancy on today's shift. A red <b>Hold-back risk</b> flag means a station is short and someone would be stuck holding over to cover it. Click <b>Fill fairly →</b> and the system instantly ranks every eligible counterpart county-wide by who's worked the <b>least</b> overtime. <b>Offer</b> the recommended one — they accept, and they're recalled. Every step is logged (see <b>Audit Log</b>). Fair, fast, nobody stuck.<div style="margin-top:9px"><button class="btn sm primary" data-act="tour">▶ Take the guided tour</button></div></div>
  <button class="x" data-act="dismissintro" aria-label="Dismiss this tip">✕</button>
</div>`;}
function segLabel(s){return s==='full24'?'24-hour (0730–0730)':s;}

/* ---------- Shortage Forecast (look-ahead) ---------- */
function fcBounds(range,anchor){
  if(range==='day')return{start:anchor,end:anchor};
  if(range==='week')return{start:anchor,end:addDays(anchor,6)};
  const d=pd(anchor),y=d.getFullYear(),mo=d.getMonth(),p=n=>String(n).padStart(2,'0');
  const last=new Date(y,mo+1,0).getDate();
  return{start:`${y}-${p(mo+1)}-01`,end:`${y}-${p(mo+1)}-${p(last)}`};
}
// scheduled-only: the forecast is what you can plan for; same-day sick calls stay in the Command Center.
function fcOpen(b){return state.vacancies.filter(v=>v.status==='open'&&v.type==='scheduled'&&v.date>=b.start&&v.date<=b.end).sort((a,z)=>a.date.localeCompare(z.date));}
function fcLabel(range,anchor){
  if(range==='day')return fmt(anchor);
  if(range==='week')return `${fmtShort(anchor)} to ${fmtShort(addDays(anchor,6))}`;
  return pd(anchor).toLocaleDateString('en-US',{month:'long',year:'numeric'});
}
function fcAction(v){if(!isBC())return '';
  return v.type==='scheduled'
    ? `<button class="btn sm" data-act="fill" data-id="${v.id}">Review & assign</button>`
    : `<button class="btn primary sm" data-act="fill" data-id="${v.id}">Fill fairly →</button>`;}
function fcDay(anchor){
  const list=fcOpen({start:anchor,end:anchor});
  if(!list.length)return `<div class="card"><div class="bd"><span class="pill ok">No known coverage gaps on ${fmt(anchor)}. Every company is staffed.</span></div></div>`;
  return `<div class="card"><div class="hd"><h3>${fmt(anchor)} · ${PLATOON[onDutyPlatoon(anchor)].name} on duty</h3><span class="spacer"></span><span class="pill ${list.some(v=>v.wouldHoldBack)?'crit':'warn'}">${list.length} gap${list.length>1?'s':''}</span></div>
  <div class="bd tight"><table class="resp"><thead><tr><th>Station</th><th>Apparatus</th><th>Shift</th><th>Reason</th><th>Status</th>${isBC()?'<th></th>':''}</tr></thead><tbody>
   ${list.map(v=>{const st=stById(v.stationId);return `<tr>
     <td data-label="Station"><b>${st.name}</b><div style="font-size:11.5px;color:var(--muted)">${st.island}${st.remote?' · Remote 72':''}</div></td>
     <td data-label="Apparatus"><b>${GRADE_OF_RANK[v.rank]||''} ${v.rank}</b> · ${v.cls}</td>
     <td data-label="Shift" class="mono">${segLabel(v.segment)} <span style="color:var(--muted)">(${v.hours}h)</span></td>
     <td data-label="Reason">${reasonLbl(v.reason)}</td>
     <td data-label="Status">${v.wouldHoldBack?'<span class="pill crit">Hold-back risk</span>':'<span class="pill warn">'+ratioStr(v)+' · short '+v.shortBy+'</span>'}</td>
     ${isBC()?`<td class="act" style="text-align:right">${fcAction(v)}</td>`:''}</tr>`;}).join('')}
  </tbody></table></div></div>
  ${isBC()?'':`<p class="note" style="margin-top:12px">Bid on any of these from <b>Bid for Assignment</b> when the date falls in your 4-day-off window.</p>`}`;
}
function fcWeek(anchor){
  let cells='';
  for(let i=0;i<7;i++){
    const ds=addDays(anchor,i),plat=onDutyPlatoon(ds),today=ds===state.demoDate;
    const list=fcOpen({start:ds,end:ds});
    const dow=pd(ds).toLocaleDateString('en-US',{weekday:'short'});
    const evs=list.map(v=>{const st=stById(v.stationId),crit=v.wouldHoldBack;
      return `<div class="ev open" ${crit?'style="background:var(--crit-bg);color:var(--crit);border-color:var(--crit)"':''} ${isBC()?`data-act="fill" data-id="${v.id}"`:'style="cursor:default"'} title="${reasonLbl(v.reason)} · ${GRADE_OF_RANK[v.rank]||''} ${v.rank}">${st.name} · ${v.cls}</div>`;}).join('');
    cells+=`<div class="cell ${today?'today':''}">
      <div class="dn"><span>${dow} ${pd(ds).getDate()}</span><span class="od" style="background:${PLATOON[plat].color}">${plat}</span></div>
      ${list.length?evs:'<div style="font-size:10px;color:var(--faint)">Staffed</div>'}</div>`;
  }
  return `<div class="card"><div class="hd"><h3>7-day look-ahead</h3><span class="spacer"></span><span class="pill accent">${fcLabel('week',anchor)}</span></div>
  <div class="bd"><div class="cal">${cells}</div></div></div>
  ${isBC()?'<p class="note" style="margin-top:12px">Click any opening to rank counterparts and fill it fairly, county-wide.</p>':''}`;
}
function fcMonth(anchor){
  const d=pd(anchor),y=d.getFullYear(),mo=d.getMonth(),p=n=>String(n).padStart(2,'0');
  const lead=new Date(y,mo,1,12).getDay(),dim=new Date(y,mo+1,0).getDate();
  let cells='';
  for(let i=0;i<lead;i++)cells+='<div class="cell empty"></div>';
  for(let dd=1;dd<=dim;dd++){
    const ds=`${y}-${p(mo+1)}-${p(dd)}`,plat=onDutyPlatoon(ds),today=ds===state.demoDate;
    const list=fcOpen({start:ds,end:ds});
    const dots=list.slice(0,4).map(v=>`<span class="dot" style="background:var(--${v.wouldHoldBack?'crit':'warn'})"></span>`).join('');
    const more=list.length>4?`<span style="font-size:9px;color:var(--muted)">+${list.length-4}</span>`:'';
    cells+=`<div class="cell ${today?'today':''}" ${list.length?`data-act="fcday" data-d="${ds}" style="cursor:pointer"`:''}>
      <div class="dn"><span>${dd}</span><span class="od" style="background:${PLATOON[plat].color}">${plat}</span></div>
      ${list.length?`<div style="display:flex;gap:3px;align-items:center;flex-wrap:wrap">${dots}${more}</div><div style="font-size:10px;color:var(--${list.some(v=>v.wouldHoldBack)?'crit':'muted'})">${list.length} gap${list.length>1?'s':''}</div>`:'<div style="font-size:10px;color:var(--faint)">Staffed</div>'}</div>`;
  }
  return `<div class="card"><div class="hd"><h3>${fcLabel('month',anchor)}</h3><span class="spacer"></span>
    <span class="legend" style="margin:0"><span><span class="dot" style="background:var(--crit)"></span> Hold-back risk</span><span><span class="dot" style="background:var(--warn)"></span> Open gap</span></span></div>
    <div class="bd"><div class="cal">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div></div></div>
    <p class="note" style="margin-top:12px">Click any day to see and ${isBC()?'fill':'review'} its coverage gaps. Same-day sick calls are not shown here; they surface in ${isBC()?'the Command Center':'Day-Of Availability'} the morning of the shift.</p>`;
}
function viewForecast(){
  const range=state.forecastRange||'week',anchor=state.forecastAnchor||state.demoDate;
  const inRange=fcOpen(fcBounds(range,anchor));
  const hb=inRange.filter(v=>v.wouldHoldBack).length,days=new Set(inRange.map(v=>v.date));
  const body=range==='day'?fcDay(anchor):range==='week'?fcWeek(anchor):fcMonth(anchor);
  const seg=r=>`<button type="button" data-act="fcrange" data-r="${r}" aria-pressed="${range===r}">${r[0].toUpperCase()+r.slice(1)}</button>`;
  return `<div class="page-head"><div><h2>Shortage Forecast</h2><p>Scheduled coverage gaps you can plan for, county-wide. Look ahead by day, week, or month.</p></div>
    <span class="spacer"></span>
    <div class="seg" role="group" aria-label="Forecast range">${seg('day')}${seg('week')}${seg('month')}</div></div>
  <div class="card" style="margin-bottom:14px"><div class="bd" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px">
    <button class="btn sm" data-act="fcnav" data-dir="-1" aria-label="Previous ${range}">‹ Prev</button>
    <b style="font-size:15px;min-width:170px;text-align:center">${fcLabel(range,anchor)}</b>
    <button class="btn sm" data-act="fcnav" data-dir="1" aria-label="Next ${range}">Next ›</button>
    <span class="spacer"></span>
    ${anchor!==state.demoDate?`<button class="btn ghost sm" data-act="fctoday">Back to today</button>`:''}
  </div></div>
  <div class="grid cols-3" style="margin-bottom:16px">
    ${statCard('Open gaps this '+range,inRange.length,'scheduled openings','')}
    ${statCard('Hold-back risk',hb,hb?'flagged high-priority':'none flagged',hb?'crit':'ok')}
    ${statCard('Days affected',days.size,'with one or more gaps','')}
  </div>
  ${body}`;
}

/* ---------- BC: Fill flow (the hero) ---------- */
function fillModal(vacId){
  const v=state.vacancies.find(x=>x.id===vacId); const st=stById(v.stationId);
  const cands=rankCandidates(v);
  const eqBest=equityBest(v);
  const bidSet=new Set(v.bids||[]);
  const offer=v.offer; // {memberId} while an offer is out for response
  const rows=cands.slice(0,8).map((m,i)=>{
    const t=tier(m,v); const bid=bidSet.has(m.id);
    const pending=offer&&offer.memberId===m.id;
    const otherPending=offer&&offer.memberId!==m.id;
    const action = pending
      ? `<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
           <span class="pill warn">Offered · awaiting reply</span>
           <div style="display:flex;gap:6px"><button class="btn primary sm" data-act="acceptoffer" data-vac="${v.id}">Accepted</button><button class="btn sm" data-act="declineoffer" data-vac="${v.id}">Declined</button></div></div>`
      : otherPending
        ? `<span style="color:var(--faint);font-size:12px">—</span>`
        : `<button class="btn primary sm" data-act="offer" data-vac="${v.id}" data-m="${m.id}">Offer recall →</button>`;
    return `<div class="cand ${i===0?'top':''}">
      <div class="rank">${i+1}</div>
      <div class="who"><b>${m.id}</b><div style="font-size:11.5px;color:var(--muted)">${m.grade}·${m.step} ${m.rank} · ${stById(m.homeStationId).name}</div></div>
      <div class="why">
        ${i===0?(state.mode==='firstcome'?'<span class="chip flag">⚡ First to respond</span>':'<span class="chip good">★ Recommended · fewest hrs</span>'):''}
        <span class="tierbadge ${t<=2?'t'+t:''}">${TIERLBL[t]}</span>
        <span class="chip good">✓ ${GRADE_OF_RANK[v.rank]||''} ${v.rank}</span>
        <span class="chip good">✓ ${v.cls}-qual</span>
        <span class="chip good">✓ 4-day off · 34-hr OK</span>
        ${bid?'<span class="chip">🖐 bid</span>':''}
        ${m.holdBackHours?`<span class="chip flag">held back ${m.holdBackHours}h</span>`:''}
      </div>
      <div class="hrs"><div class="big" style="color:var(--${m.fyHours<FY_CAP*.5?'ok':m.fyHours>=FY_CAP*.9?'crit':'text'})">${m.fyHours} / ${FY_CAP}h</div>
        <div style="font-size:11px;color:var(--muted)">${remaining(m)}h remaining</div></div>
      ${action}
    </div>`;}).join('');
  return modalShell(`Fill vacancy — ${st.name} ${GRADE_OF_RANK[v.rank]||''} ${v.rank} · ${v.cls}`,`
    <div class="kv" style="margin-bottom:14px">
      <dt>Station</dt><dd>${st.name} · ${st.island}${st.remote?' · Remote 72':''}</dd>
      <dt>Position</dt><dd>${GRADE_OF_RANK[v.rank]||''} ${v.rank} · ${v.cls} — staffing ${ratioStr(v)} (min ${coMin(v)})</dd>
      <dt>Shift</dt><dd>${fmt(v.date)} · ${segLabel(v.segment)} · ${v.hours}h</dd>
      <dt>Reason</dt><dd>${reasonLbl(v.reason)} · ${v.type}</dd>
    </div>
    ${v.wouldHoldBack?`<div class="note" style="border-color:var(--crit);color:var(--crit);background:var(--crit-bg);margin-bottom:14px">
      <b>Today's manual outcome:</b> no one at ${st.name} can backfill → an off-going member gets <b>held back</b> to hold minimum staffing. Those hours don't even count toward their recall total. <button class="btn crit sm" data-act="holdback" data-vac="${v.id}" style="margin-top:8px">Record this hold-back (status quo) →</button></div>`:''}
    <h4 style="margin:0 0 4px">${state.mode==='firstcome'?'Eligible counterparts — first-come, first-serve (policy §VI as written)':'Eligible counterparts — ranked by fewest recall hours (equity-first)'}</h4>
    <p style="margin:0 0 14px;color:var(--muted);font-size:13px">${cands.length} eligible county-wide. Grade-for-grade (${GRADE_OF_RANK[v.rank]}↔${GRADE_OF_RANK[v.rank]}, ${v.rank}) + similar-function (${v.cls}↔${v.cls}), within 4-day off, under the 34-hr cap. ${state.mode==='firstcome'
      ? `Ordered by who responds first via First Due — which surfaces the most frequent OT-takers and concentrates hours.${eqBest?` <b style="color:var(--accent)">Equity-first would instead offer ${eqBest.id} (${eqBest.fyHours}h)</b> — the lowest-hours eligible counterpart.`:''}`
      : `<b>Offer the recommended member</b> — they accept or decline (30-min window). Offering anyone below the recommendation is logged as an override.`}</p>
    ${rows||`<div class="note" style="border-color:var(--crit);color:var(--crit);background:var(--crit-bg)"><b>No eligible counterpart county-wide.</b> Under the status quo, the only option left is to hold an off-going member over.<br><button class="btn crit sm" data-act="holdback" data-vac="${v.id}" style="margin-top:8px">Record forced hold-back →</button></div>`}
  `,`${v.status==='open'&&cands.length?`<button class="btn ghost sm" data-act="holdback" data-vac="${v.id}" title="Show the status-quo alternative: an off-going member held over instead of a fair recall">Can't fill → record hold-back</button><span style="flex:1"></span>`:''}<button class="btn" data-act="closemodal">Close</button>`);
}

/* ---------- BC: Equity dashboard ---------- */
function viewEquity(){
  const ms=Object.values(state.members); const hrs=ms.map(m=>m.fyHours);
  const avg=Math.round(hrs.reduce((a,b)=>a+b,0)/ms.length);
  const min=Math.min(...hrs),max=Math.max(...hrs);
  // histogram in 24h buckets
  const buckets=Array(13).fill(0); hrs.forEach(h=>buckets[Math.min(12,Math.floor(h/24))]++);
  const bmax=Math.max(...buckets);
  const low=[...ms].sort((a,b)=>a.fyHours-b.fyHours).slice(0,6);
  // per-class spread
  const byClass=CLASSES.map(c=>{const g=ms.filter(m=>m.qualifiedClasses.includes(c));const h=g.map(x=>x.fyHours);
    return{c,n:g.length,avg:h.length?Math.round(h.reduce((a,b)=>a+b,0)/h.length):0};});
  return `<div class="page-head"><div><h2>Equity Dashboard</h2><p>Overtime distribution across all ${ms.length} ranked members this fiscal year (cap ${FY_CAP}h each)</p></div></div>
  <div class="grid cols-4" style="margin-bottom:18px">
    ${statCard('Avg hours / member',avg+'h','target: even spread','')}
    ${statCard('Spread (min–max)',min+'–'+max+'h',(max-min)+'h gap to close',(max-min)>180?'warn':'ok')}
    ${statCard('Under 50% of cap',ms.filter(m=>m.fyHours<FY_CAP*.5).length,'first in line','ok')}
    ${statCard('Within 24h of cap',ms.filter(m=>remaining(m)<=24).length,'nearly maxed','warn')}
  </div>
  <div class="grid cols-2">
    <div class="card"><div class="hd"><h3>Hours distribution</h3></div><div class="bd">
      <div class="distrib">${buckets.map(b=>`<div class="b" style="height:${Math.max(3,Math.round(b/bmax*120))}px" title="${b} members"></div>`).join('')}</div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px"><span>0h</span><span>144h</span><span>${FY_CAP}h</span></div>
      <p class="note" style="margin-top:14px">Equity-first assignment pushes this distribution toward a single tall column near the average — everyone offered a fair share of the ${FY_CAP} hours.</p>
    </div></div>
    <div class="card"><div class="hd"><h3>Lowest-hours members (next in line)</h3></div><div class="bd tight"><table><tbody>
      ${low.map(m=>`<tr><td><b class="mono">${m.id}</b> <span class="ptag ${m.platoon}">${m.platoon}</span></td><td>${stById(m.homeStationId).name}</td>
      <td style="width:140px">${hoursBar(m.fyHours)}</td><td class="mono" style="text-align:right">${m.fyHours}h${m.holdBackHours?` <span class="pill crit" title="hold-back hours, not counted">+${m.holdBackHours} HB</span>`:''}</td></tr>`).join('')}
    </tbody></table></div></div>
  </div>

function calendar(m,mode){
  const start='2026-06-01'; const first=pd(start); const lead=first.getDay(); const days=30;
  let cells='';
  for(let i=0;i<lead;i++)cells+='<div class="cell empty"></div>';
  for(let d=1;d<=days;d++){
    const ds=`2026-06-${String(d).padStart(2,'0')}`;
    const plat=onDutyPlatoon(ds); const today=ds===state.demoDate;
    const onDuty=isOnDuty(m,ds); const elig=inFourDayOff(m,ds)&&!adjacentOnDuty(m,ds)&&!onDuty;
    let ev='';
    if(mode==='opps'){

// Demo-coherent clock: each new audit entry advances a few minutes past the most recent one,
// so the log reads as one continuous shift instead of jumping to real wall-clock time.
function nextLogTime(){const log=state.log||[];let base=7*60+45; // 07:45 default start
  if(log.length){const p=String(log[0].t).split(':').map(Number);if(!isNaN(p[0]))base=p[0]*60+(p[1]||0);}
  const t=Math.min(23*60+59,base+3+(log.length%4)); // +3..+6 min, monotonic
  return ('0'+Math.floor(t/60)).slice(-2)+':'+('0'+(t%60)).slice(-2);}
function logEvent(type,v,memberId,note){if(!state.log)state.log=[];state.log.unshift({t:nextLogTime(),type,by:'BC '+bcNum(),memberId,station:stById(v.stationId).name,rank:v.rank,cls:v.cls,vacId:v.id,note:note||''});}

    if(rec&&rec.id!==mId)logEvent('override',v,mId,`Offered ${m.fyHours}h member over recommended ${rec.id} (${rec.fyHours}h)`);
    logEvent('offer',v,mId,(rec&&rec.id===mId)?'Recommended — fewest recall hours':'Override offer');
  } else {

/* ---------- Equity projection: phone-tree (first-come) vs equity-first ---------- */
function runProjection(){
  const distFC=document.getElementById('distFC'),distEQ=document.getElementById('distEQ');
  if(!distFC||!distEQ)return;
  const btn=document.getElementById('projRunBtn'),live=document.getElementById('projLive');
  const verdict=document.getElementById('projVerdict'),metFC=document.getElementById('metFC'),metEQ=document.getElementById('metEQ');
  if(window.__projTimer){clearInterval(window.__projTimer);window.__projTimer=null;}

  const ms=Object.values(state.members),N=ms.length;
  const weights=ms.map(m=>eagerness(m));
  const startHrs=ms.map(()=>0); // project a full fiscal year from an even start
  const totalH=ms.reduce((a,m)=>a+m.fyHours,0);
  const shifts=Math.max(N,Math.round(totalH/24)); // the same total overtime actually worked this year, in 24h blocks
  const SEED=424242,FRAMES=40,sampleEvery=Math.max(1,Math.floor(shifts/FRAMES));

  // simulate one method, recording snapshots for playback
  function trajectory(mode){
    const hrs=startHrs.slice(),rng=mulberry32(SEED),snaps=[hrs.slice()];
    for(let s=0;s<shifts;s++){
      if(mode==='eq'){ // lowest-hours first
        let li=-1;for(let i=0;i<N;i++){if(hrs[i]<FY_CAP&&(li<0||hrs[i]<hrs[li]))li=i;}
        if(li<0)break; hrs[li]=Math.min(FY_CAP,hrs[li]+24);
      } else { // weighted-random among those with remaining cap
        let tot=0;for(let i=0;i<N;i++)if(hrs[i]<FY_CAP)tot+=weights[i];
        if(tot<=0)break; let r=rng()*tot,pick=-1;
        for(let i=0;i<N;i++){if(hrs[i]<FY_CAP){r-=weights[i];if(r<=0){pick=i;break;}}}
        if(pick<0)for(let i=N-1;i>=0;i--){if(hrs[i]<FY_CAP){pick=i;break;}}
        if(pick<0)break; hrs[pick]=Math.min(FY_CAP,hrs[pick]+24);
      }
      if(s%sampleEvery===0)snaps.push(hrs.slice());
    }
    snaps.push(hrs.slice());
    return snaps;
  }
  const buckets=hrs=>{const b=Array(13).fill(0);hrs.forEach(h=>b[Math.min(12,Math.floor(h/24))]++);return b;};
  const spread=hrs=>Math.round(Math.max(...hrs)-Math.min(...hrs));
  const maxed=hrs=>hrs.filter(h=>h>=264).length;   // near the FY cap
  const starved=hrs=>hrs.filter(h=>h<48).length;   // shut out of overtime

  const snapsFC=trajectory('fc'),snapsEQ=trajectory('eq');
  // fixed y-scale across every frame of both runs so bars only grow within a stable frame
  let scale=1;[...snapsFC,...snapsEQ].forEach(h=>{const b=buckets(h);const m=Math.max(...b);if(m>scale)scale=m;});
  const setBars=(pre,hrs)=>{const b=buckets(hrs);for(let i=0;i<13;i++){const el=document.getElementById(pre+i);if(el)el.style.height=Math.max(3,Math.round(b[i]/scale*120))+'px';}};
  const setMet=(el,hrs,tone)=>{if(el)el.innerHTML=`Spread <b style="color:var(--${tone})">${spread(hrs)}h</b> · <b>${maxed(hrs)}</b> near cap · <b>${starved(hrs)}</b> under 48h`;};

  const finalFC=snapsFC[snapsFC.length-1],finalEQ=snapsEQ[snapsEQ.length-1];
  function finish(){
    setBars('fcb',finalFC);setBars('eqb',finalEQ);
    setMet(metFC,finalFC,'crit');setMet(metEQ,finalEQ,'ok');
    if(verdict){verdict.hidden=false;
      verdict.innerHTML=`The same <b>${(shifts*24).toLocaleString()}h</b> of overtime, redistributed from an even start. Phone-tree pushes <b>${maxed(finalFC)}</b> members to the cap while <b>${starved(finalFC)}</b> get almost none — a <b>${spread(finalFC)}h</b> gap. Equity-first holds everyone within <b>${spread(finalEQ)}h</b> of each other — none maxed, none shut out — for the same dollars.`;}
    if(live)live.textContent=`Projection complete. Phone-tree leaves a ${spread(finalFC)} hour gap with ${maxed(finalFC)} members near the cap; equity-first holds everyone within ${spread(finalEQ)} hours.`;
    if(btn){btn.disabled=false;btn.textContent='↺ Replay projection';}
  }

  if(btn){btn.disabled=true;btn.textContent='Projecting…';}
  if(verdict)verdict.hidden=true;
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduce){finish();return;}

  const frames=Math.max(snapsFC.length,snapsEQ.length);let f=0;
  setBars('fcb',snapsFC[0]);setBars('eqb',snapsEQ[0]);
  window.__projTimer=setInterval(()=>{
    f++;
    const fcH=snapsFC[Math.min(f,snapsFC.length-1)],eqH=snapsEQ[Math.min(f,snapsEQ.length-1)];
    setBars('fcb',fcH);setBars('eqb',eqH);setMet(metFC,fcH,'crit');setMet(metEQ,eqH,'ok');
    if(f>=frames-1){clearInterval(window.__projTimer);window.__projTimer=null;finish();}
  },55);
}

  body:'Every rule here is cited to the <b>Rank-for-Rank Recall Program (eff. 11/1/2025)</b> and <b>CBA §27-A</b>. This isn’t a new policy — it’s the tool that delivers the one you already signed.'}
];
function tourStart(){tourGo(0);}
function tourGo(n){
  if(n<0)n=0;
  if(n>=TOUR.length){tourEnd();return;}
  const s=TOUR[n];
  state.tour={active:true,step:n};
  if(s.role)state.role=s.role;
  if(s.mode)state.mode=s.mode;
  if(s.view)state.view=s.view;
  state.modal=s.modal?{type:s.modal.type,id:s.modal.id}:null;
  render();                       // builds the view + modal, then renderTour() positions the spotlight
  if(s.run){try{s.run();}catch(e){}}
}
function tourEnd(){const was=state.tour&&state.tour.active;state.tour=null;state.modal=null;render();
  if(was)toast('ok','Tour complete','Explore freely — switch roles, flip the recall order, run the projection.');}
function renderTour(){
  const t=state.tour, root=$('#tourRoot');
  if(!t||!t.active){root.innerHTML='';return;}
  const s=TOUR[t.step];
  let layer=`<div class="tour-backdrop"></div>`;
  const target=s.sel?document.querySelector(s.sel):null;
  if(target){
    try{target.scrollIntoView({block:'center',inline:'center'});}catch(e){}
    const r=target.getBoundingClientRect(), pad=6;
    if(r.width&&r.height) layer=`<div class="tour-block"></div><div class="tour-spot" style="top:${Math.max(4,r.top-pad)}px;left:${Math.max(4,r.left-pad)}px;width:${r.width+pad*2}px;height:${r.height+pad*2}px"></div>`;
  }
  const first=t.step===0, last=t.step===TOUR.length-1;
  const dots=TOUR.map((_,i)=>`<i class="${i===t.step?'on':''}"></i>`).join('');
  root.innerHTML=`${layer}
   <div class="tour-card" role="dialog" aria-modal="true" aria-label="Guided tour, step ${t.step+1} of ${TOUR.length}">
     <div class="tour-step">Guided tour · step ${t.step+1} of ${TOUR.length}</div>
     <h3>${s.title}</h3>
     <p>${s.body}</p>
     <div class="tour-nav">
       <button class="btn ghost sm" data-act="tourend">Skip</button>
       <span class="tour-dots" aria-hidden="true">${dots}</span>
       <span style="flex:1"></span>
       ${first?'':'<button class="btn sm" data-act="tourback">← Back</button>'}
       <button class="btn primary sm" data-act="tournext">${last?'Finish ✓':'Next →'}</button>
     </div>
   </div>`;
  const nx=root.querySelector('[data-act="tournext"]'); if(nx)nx.focus();
}

/* ---------- global event delegation ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t)return; const a=t.dataset.act;
  if(a==='nav'){state.view=t.dataset.v;render();}
  else if(a==='fill'){modalTrigger=t;state.modal={type:'fill',id:t.dataset.id};render();}
  else if(a==='offer'){offerRecall(t.dataset.vac,t.dataset.m);}
  else if(a==='acceptoffer'){respondOffer(t.dataset.vac,true);}
  else if(a==='declineoffer'){respondOffer(t.dataset.vac,false);}
  else if(a==='holdback'){recordHoldback(t.dataset.vac);}
  else if(a==='closemodal'||a==='scrim'){if(a==='scrim'&&e.target!==t)return;closeModal();}
  else if(a==='clearnotif'){state.notifications=[];closeModal();}
  else if(a==='bid'){placeBid(t.dataset.id);}
  else if(a==='bidwarn'){bidWarn(t.dataset.id);}
  else if(a==='setavail'){setAvail(t.dataset.d,true);}
  else if(a==='unavail'){setAvail(t.dataset.d,false);}
  else if(a==='suspend'){suspend(t.dataset.m);}
  else if(a==='togglePref'){togglePref(t.dataset.c);}
  else if(a==='createvac'){createVac();}
  else if(a==='csvHours'){csvHours();}
  else if(a==='csvAssign'){csvAssign();}
  else if(a==='csvAudit'){csvAudit();}
  else if(a==='fcrange'){state.forecastRange=t.dataset.r;render();}
  else if(a==='fcday'){state.forecastRange='day';state.forecastAnchor=t.dataset.d;render();}
  else if(a==='fctoday'){state.forecastAnchor=state.demoDate;render();}
  else if(a==='fcnav'){const dir=+t.dataset.dir,r=state.forecastRange||'week';let an=state.forecastAnchor||state.demoDate;
    if(r==='day')an=addDays(an,dir);else if(r==='week')an=addDays(an,dir*7);
    else{const d=pd(an);d.setDate(1);d.setMonth(d.getMonth()+dir);an=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;} // pin to the 1st so a 31st anchor can't overflow past a short month
    state.forecastAnchor=an;render();}
  else if(a==='mode'){if(state.mode!==t.dataset.mode){state.mode=t.dataset.mode;save();render();toast(state.mode==='equity'?'ok':'warn',state.mode==='equity'?'Equity-first order':'First-come order (policy as written)',state.mode==='equity'?'Recall is now offered to the fewest-hours counterpart.':'Recall now goes to whoever responds first — watch the recommendation change.');}}
  else if(a==='runproj'){runProjection();}
  else if(a==='dismissintro'){state.introDismissed=true;save();render();}
  else if(a==='how'){state.view='how';render();}
  else if(a==='tour'){tourStart();}
  else if(a==='tournext'){tourGo((state.tour?state.tour.step:0)+1);}
  else if(a==='tourback'){tourGo((state.tour?state.tour.step:0)-1);}
  else if(a==='tourend'){tourEnd();}
  else if(a==='print'){window.print();}
});
document.addEventListener('keydown',e=>{
  if(state.tour&&state.tour.active){
    if(e.key==='Escape'){e.preventDefault();tourEnd();return;}
    if(e.key==='ArrowRight'){e.preventDefault();tourGo(state.tour.step+1);return;}
    if(e.key==='ArrowLeft'){e.preventDefault();tourGo(state.tour.step-1);return;}
    if(e.key==='Tab')return; // let focus stay on the tour card; skip the modal trap
  }
  if(!state.modal)return;
  if(e.key==='Escape'){e.preventDefault();closeModal();return;}
  if(e.key==='Tab'){const f=modalFocusables();if(!f.length)return;const first=f[0],last=f[f.length-1],ae=document.activeElement;
    if(e.shiftKey&&(ae===first||!f.includes(ae))){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&(ae===last||!f.includes(ae))){e.preventDefault();first.focus();}}
});
$('#tabs').addEventListener('keydown',e=>{
  if(!['ArrowRight','ArrowLeft','Home','End'].includes(e.key))return;
  const tabs=[...$('#tabs').querySelectorAll('[role=tab]')]; if(!tabs.length)return;
  let i=tabs.indexOf(document.activeElement); if(i<0)i=tabs.findIndex(t=>t.getAttribute('aria-selected')==='true'); if(i<0)i=0;
  let j=i;
  if(e.key==='ArrowRight')j=(i+1)%tabs.length; else if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;
  else if(e.key==='Home')j=0; else if(e.key==='End')j=tabs.length-1;
  e.preventDefault(); const k=tabs[j].dataset.v; tabs[j].click(); const nt=document.getElementById('tab-'+k); if(nt)nt.focus();
});
$('#roleSel').addEventListener('change',e=>{state.role=e.target.value;state.view=null;render();});
$('#themeBtn').addEventListener('click',()=>{state.theme=state.theme==='light'?'dark':'light';render();});
$('#resetBtn').addEventListener('click',resetDemo);
$('#bell').addEventListener('click',()=>{
  if(!state.notifications.length){toast('','No notifications','');return;}
  modalTrigger=$('#bell'); state.modal={type:'notif'}; render();
});

/* ============================================================ 7. INIT */
load();
if(!state.notifications.length){notify('Sick call at Kīhei — Engine short 1 for today\'s shift. Recall opportunity open.');}
render();
// ponytail: forecast self-check — run with ?selftest, results in console. No UI impact.
if(location.search.includes('selftest')){
  const g1=JSON.stringify(genForecast()),g2=JSON.stringify(genForecast());
  console.assert(g1===g2,'genForecast is deterministic');
  const gs=genForecast();
  console.assert(gs.length&&gs.every(v=>v.date>DEMO_DATE&&v.type==='scheduled'&&v.status==='open'),'forecast entries are future scheduled openings');
  const wb=fcBounds('week','2026-06-21');
  console.assert(wb.start==='2026-06-21'&&wb.end==='2026-06-27','week bounds are 7 inclusive days');
  const mb=fcBounds('month','2026-07-15');
  console.assert(mb.start==='2026-07-01'&&mb.end==='2026-07-31','month bounds cover the whole month');
  console.assert(fcBounds('day','2026-07-04').start===fcBounds('day','2026-07-04').end,'day bounds are a single day');
  console.log('MFDR4R forecast self-test: assertions ran ('+gs.length+' seeded gaps)');
}
</script>
